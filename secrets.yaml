# Maps runtime.getSecret({ id: "ATTACK_TX" }) to SECRET_ATTACK_TX.
# The value is <payout-address>:<base64 transaction>. script/test.sh writes it
# into a temp env file for one run. Do not commit a .env that holds it.
# On mainnet the same id is released by the Vault DON into the attested enclave.
secretsNames:
  ATTACK_TX:
    - SECRET_ATTACK_TX
